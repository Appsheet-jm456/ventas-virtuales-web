<title>Panel Admin Ventas Virtual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: shell de una pantalla. Panel lateral izquierdo que se colapsa a riel de iconos; contenido por módulo. Paleta de la landing (azul corporativo). */
:root {
  --blue: #17348f;
  --blue-ink: #0b1c4d;
  --bg: #f2f5fa;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --border: #dfe5ee;
  --text: #1d2733;
  --muted: #5c6b80;
  --side: #0e2160;
  --side-text: #c9d6ff;
  --side-active: #ffffff;
  --side-active-bg: rgba(255,255,255,.14);
  --accent-soft: #e8edfb;
  --ok: #148a3c; --ok-bg: #e6f6ec;
  --bad: #c62828; --bad-bg: #fdeaea;
  --warn: #9a5b00; --warn-bg: #fff3dc;
  --wa: #25d366;
  --shadow: 0 4px 18px rgba(13,32,84,.10);
  --sans: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #7f9bff; --blue-ink: #e6ecff; --bg: #0c1220; --surface: #141c2f; --surface-2: #19223a;
    --border: #26314d; --text: #e6ebf5; --muted: #93a1ba; --side: #080d1a; --side-text: #9fb0d8;
    --side-active: #fff; --side-active-bg: rgba(127,155,255,.18); --accent-soft: #1e2a4d;
    --ok: #4cd37d; --ok-bg: #12301f; --bad: #ff7b7b; --bad-bg: #3a1a1c; --warn: #ffc261; --warn-bg: #3a2c10;
    --shadow: 0 4px 18px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue: #7f9bff; --blue-ink: #e6ecff; --bg: #0c1220; --surface: #141c2f; --surface-2: #19223a;
  --border: #26314d; --text: #e6ebf5; --muted: #93a1ba; --side: #080d1a; --side-text: #9fb0d8;
  --side-active: #fff; --side-active-bg: rgba(127,155,255,.18); --accent-soft: #1e2a4d;
  --ok: #4cd37d; --ok-bg: #12301f; --bad: #ff7b7b; --bad-bg: #3a1a1c; --warn: #ffc261; --warn-bg: #3a2c10;
  --shadow: 0 4px 18px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #7fa2ff; outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--sw, 252px) minmax(0, 1fr); height: 100%; transition: grid-template-columns .22s ease; }
.shell.mini { --sw: 68px; }
.side { background: var(--side); color: var(--side-text); display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative; z-index: 30; }
.brand { display: flex; align-items: center; gap: 12px; padding: 16px 14px; height: 64px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: #fff; color: #17348f; font-weight: 800; display: grid; place-items: center; flex: none; letter-spacing: -.02em; }
.brand-t { white-space: nowrap; line-height: 1.15; overflow: hidden; }
.brand-t b { display: block; color: #fff; font-size: 15px; }
.brand-t small { font-size: 12px; opacity: .75; }
.nav { flex: 1; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.nav-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 12px 6px; opacity: .6; white-space: nowrap; }
.nav button { display: flex; align-items: center; gap: 14px; width: 100%; height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--side-text); text-align: left; white-space: nowrap; font-weight: 600; position: relative; }
.nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav button[aria-current="page"] { background: var(--side-active-bg); color: var(--side-active); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: #fff; }
.badge { margin-left: auto; background: #ffb020; color: #3a2500; border-radius: 999px; font-size: 11px; font-weight: 800; padding: 2px 7px; }
.mini .brand-t, .mini .nav-h, .mini .badge, .mini .side-foot .who { display: none; }
.mini .nav button span.lbl { display: none; }
.mini .nav button { justify-content: center; padding: 0; }
.mini .nav button:hover::after { content: attr(data-tip); position: fixed; left: 76px; background: #0b1c4d; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow); z-index: 60; pointer-events: none; }
.side-foot { padding: 10px; border-top: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #2d4cc0; color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.who { line-height: 1.2; white-space: nowrap; overflow: hidden; font-size: 13px; }
.who b { display: block; color: #fff; }
.who a { color: var(--side-text); font-size: 12px; text-decoration: underline; background: none; border: 0; padding: 0; cursor: pointer; }
.mini .side-foot { justify-content: center; }

/* ---------- Main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.top { display: flex; align-items: center; gap: 12px; height: 64px; padding-inline: max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--border); flex: none; }
.ibtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--text); }
.ibtn:hover { background: var(--accent-soft); }
.top h1 { font-size: 18px; margin: 0; font-weight: 800; color: var(--blue-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .sp { flex: 1; }
.sitelink { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); text-decoration: none; color: var(--text); font-weight: 600; white-space: nowrap; }
.sitelink:hover { background: var(--accent-soft); }
.content { flex: 1; overflow-y: auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.sample { font-size: 12px; color: var(--muted); }

/* ---------- Common ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 16px; color: var(--blue-ink); }
.card .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.sb { justify-content: space-between; }
.btn { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { background: var(--accent-soft); }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
:root[data-theme="dark"] .btn.pri { color: #0b1c4d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.pri { color: #0b1c4d; } }
.btn.pri:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.mute { background: var(--accent-soft); color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-weight: 700; font-size: 13px; }
.field small { color: var(--muted); }
.in { height: 42px; border: 1.5px solid var(--border); background: var(--surface); border-radius: 10px; padding: 0 12px; min-width: 0; width: 100%; }
textarea.in { height: auto; padding: 10px 12px; resize: vertical; }
.in:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(23,52,143,.12); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.thumb { width: 44px; height: 44px; border-radius: 8px; flex: none; }
.pcell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
.pcell b { display: block; }
.pcell small { color: var(--muted); }
.menu { position: relative; display: inline-block; }
.menu .pop { position: absolute; right: 0; top: 40px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 20; min-width: 170px; }
.menu .pop button { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: none; padding: 9px 10px; border-radius: 8px; text-align: left; }
.menu .pop button:hover { background: var(--accent-soft); }
.menu .pop .bad { color: var(--bad); }

/* ---------- Bandeja ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi .l { color: var(--muted); font-size: 13px; font-weight: 600; }
.kpi .v { font-size: 30px; font-weight: 800; color: var(--blue-ink); letter-spacing: -.02em; line-height: 1; }
.kpi .d { font-size: 12.5px; font-weight: 700; }
.up { color: var(--ok); } .down { color: var(--bad); }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .bar { fill: var(--blue); opacity: .85; }
.chart .bar.hi { opacity: 1; }
.chart .ln { fill: none; stroke: var(--wa); stroke-width: 2.5; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.rank li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.rank .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.rank .bar i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.alerts li { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.alerts li > div { flex: 1; min-width: 0; }
.alerts .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.alerts .ic.warn { background: var(--warn-bg); color: var(--warn); }
.alerts .ic.bad { background: var(--bad-bg); color: var(--bad); }
.alerts .ic.ok { background: var(--ok-bg); color: var(--ok); }

/* ---------- CSV ---------- */
.drop { border: 2px dashed var(--border); border-radius: 12px; padding: 28px 16px; text-align: center; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.drop.over { border-color: var(--blue); background: var(--accent-soft); }
.drop svg.i { width: 34px; height: 34px; color: var(--blue); }
.steps { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.steps b { color: var(--text); }
.stat { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Banners ---------- */
.stage { position: relative; aspect-ratio: 16 / 5; width: 100%; border-radius: 12px; overflow: hidden; background: #0e2160; color: #fff; isolation: isolate; }
.stage .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .5s; }
.stage .slide.on { opacity: 1; }
.stage .photo { position: absolute; inset: 0; }
.stage .cut { position: absolute; inset: 0; clip-path: polygon(0 0, 58% 0, 42% 100%, 0 100%); background: linear-gradient(120deg, rgba(14,33,96,.96), rgba(23,52,143,.9)); display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 5%; gap: 8px; }
.stage .cut h3 { margin: 0; font-size: clamp(16px, 3.2vw, 32px); line-height: 1.1; max-width: 46%; text-wrap: balance; }
.stage .cut p { margin: 0; font-size: clamp(11px, 1.4vw, 15px); opacity: .85; max-width: 40%; }
.stage .cut span { align-self: flex-start; background: var(--wa); color: #05391f; font-weight: 800; border-radius: 999px; padding: 5px 14px; font-size: clamp(10px, 1.3vw, 13px); }
.dots { position: absolute; bottom: 8px; right: 12px; display: flex; gap: 6px; z-index: 2; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.4); }
.dots i.on { background: #fff; }
.blist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.bitem { display: grid; grid-template-columns: auto 96px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.bitem.drag { opacity: .4; }
.bitem.target { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23,52,143,.15); }
.grip { cursor: grab; color: var(--muted); display: grid; place-items: center; width: 28px; height: 40px; }
.bthumb { width: 96px; height: 40px; border-radius: 6px; overflow: hidden; position: relative; }
.bthumb::after { content: ""; position: absolute; inset: 0; clip-path: polygon(0 0, 58% 0, 42% 100%, 0 100%); background: rgba(14,33,96,.85); }
.bitem b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bitem small { color: var(--muted); }
.bact { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.catimgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.catimg { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
.catimg .ph { aspect-ratio: 4 / 3; position: relative; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; }
.catimg .cap { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.size { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* ---------- Config ---------- */
.cfg { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; }
.cfgnav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }
.cfgnav a { padding: 9px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; }
.cfgnav a:hover { background: var(--accent-soft); color: var(--text); }
.cfgstack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.switch:last-child { border-bottom: 0; }
.switch small { color: var(--muted); display: block; }
.tg { width: 44px; height: 26px; border-radius: 999px; border: 0; background: var(--border); position: relative; flex: none; transition: background .15s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tg[aria-checked="true"] { background: var(--ok); }
.tg[aria-checked="true"]::after { transform: translateX(18px); }
.savebar { position: sticky; bottom: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: var(--shadow); }

.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 20px); background: #0b1c4d; color: #fff; padding: 11px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .25s; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.scrim { display: none; }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .cfg { grid-template-columns: minmax(0, 1fr); }
  .cfgnav { flex-direction: row; overflow-x: auto; position: static; }
  .cfgnav a { white-space: nowrap; }
}
@media (max-width: 720px) {
  /* En celular el riel de iconos queda fijo y el panel abierto se superpone */
  .shell { grid-template-columns: 64px minmax(0, 1fr); }
  .shell.mini { --sw: 64px; }
  .shell:not(.mini) .side { position: fixed; inset: 0 auto 0 0; width: 252px; box-shadow: 8px 0 30px rgba(0,0,0,.35); }
  .shell:not(.mini) .scrim { display: block; position: fixed; inset: 0; background: rgba(5,10,30,.45); z-index: 25; }
  .side { position: relative; }
  .sitelink span { display: none; }
  .sitelink { padding: 0; width: 40px; justify-content: center; }
  .bitem { grid-template-columns: auto minmax(0, 1fr); }
  .bitem .bthumb { display: none; }
  .bact { grid-column: 1 / -1; justify-content: flex-start; }
  .stage .cut h3, .stage .cut p { max-width: 50%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Menú del panel">
    <div class="brand">
      <div class="logo">VV</div>
      <div class="brand-t"><b>Ventas Virtual</b><small>Panel de administración</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="avatar">JM</div>
      <div class="who"><b>Dueño</b><button type="button" class="linkbtn" id="logout" style="background:none;border:0;padding:0;color:var(--side-text);text-decoration:underline;font-size:12px;">Cerrar sesión</button></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <button class="ibtn" id="toggle" type="button" aria-label="Abrir o cerrar el menú" aria-expanded="true"></button>
      <h1 id="title">Bandeja de entrada</h1>
      <span class="sp"></span>
      <button class="ibtn" id="theme" type="button" aria-label="Cambiar tema"></button>
      <a class="sitelink" href="#" id="site"></a>
    </header>
    <main class="content" id="content"><div class="page" id="page"></div></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var ICONS = {
    inbox: '<path d="M3 13l2.5-7.5A2 2 0 0 1 7.4 4h9.2a2 2 0 0 1 1.9 1.5L21 13"/><path d="M3 13v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5h-5.5a2.5 2.5 0 0 1-5 0H3z"/>',
    box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12.5l8.7-5M12 22V12.5"/>',

        '<div class="tablewrap"><table><thead><tr><th>' + head.slice(0, 4).map(esc).join('</th><th>') + '</th><th>Estado</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="row" style="margin-top:14px"><button type="button" class="btn pri" id="okcsv">' + ic('check') + 'Confirmar carga</button><button type="button" class="btn" id="nocsv">Cancelar</button></div>';
      $('#okcsv').onclick = function () { toast(data.length + ' productos cargados en Supabase (ejemplo)'); p.hidden = true; };
      $('#nocsv').onclick = function () { p.hidden = true; };
    }
    function read(file) { if (!file) return; var r = new FileReader(); r.onload = function () { handle(String(r.result)); }; r.readAsText(file); }
    f.onchange = function () { read(f.files[0]); };
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { read(e.dataTransfer.files[0]); });
    handle('nombre,marca,categoria,precio\nLenovo ThinkPad T14,Lenovo,Portátiles,1890000\nDell Latitude 7420,Dell,Portátiles,2150000\nHP EliteDesk 800 G5,HP,Torres Tiny,780000\nMemoria RAM 8 GB,Kingston,Partes,sin precio');
  }

  /* ---------- 3 · Banners e imágenes ---------- */
  var cur = 0, timer = null, dragIdx = null;
  function banners() {
    var active = BANNERS.filter(function (b) { return b.on; });
    var slides = active.map(function (b, i) {
      return '<div class="slide' + (i === cur % Math.max(active.length, 1) ? ' on' : '') + '"><div class="photo" style="background:linear-gradient(135deg,' + b.c1 + ',' + b.c2 + ')"></div><div class="cut"><h3>' + esc(b.t) + '</h3><p>' + esc(b.d) + '</p><span>' + esc(b.cta) + '</span></div></div>';
    }).join('');
    var dots = active.map(function (b, i) { return '<i class="' + (i === cur % active.length ? 'on' : '') + '"></i>'; }).join('');
    var list = BANNERS.map(function (b, i) {
      return '<li class="bitem" draggable="true" data-i="' + i + '"><span class="grip" title="Arrastra para ordenar">' + ic('grip') + '</span><div class="bthumb" style="background:linear-gradient(135deg,' + b.c1 + ',' + b.c2 + ')"></div><div style="min-width:0"><b>' + esc(b.t) + '</b><small>' + (b.on ? 'Activo' : 'Desactivado') + ' · Posición ' + (i + 1) + ' · ' + esc(b.href) + '</small></div>' +
        '<div class="bact"><button type="button" class="ibtn" data-b="up" data-i="' + i + '" aria-label="Subir" ' + (i === 0 ? 'disabled style="opacity:.4"' : '') + '>' + ic('up') + '</button><button type="button" class="ibtn" data-b="down" data-i="' + i + '" aria-label="Bajar" ' + (i === BANNERS.length - 1 ? 'disabled style="opacity:.4"' : '') + '>' + ic('down') + '</button>' +
        '<button type="button" class="tg" role="switch" aria-checked="' + b.on + '" data-b="on" data-i="' + i + '" aria-label="Activar banner"></button><button type="button" class="ibtn" data-b="edit" data-i="' + i + '" aria-label="Editar">' + ic('edit') + '</button><button type="button" class="ibtn" data-b="del" data-i="' + i + '" aria-label="Quitar">' + ic('trash') + '</button></div></li>';
    }).join('');
    var imgs = CATS.map(function (c) {
      return '<div class="catimg"><div class="ph" style="background:linear-gradient(135deg,' + c.c1 + ',' + c.c2 + ')">' + esc(c.n) + '</div><div class="cap"><span class="size">800×600</span><button type="button" class="btn sm" data-img="' + c.id + '">' + ic('upload') + 'Cambiar</button></div></div>';
    }).join('');
    page(
      '<section class="card"><div class="row sb"><div><h2>Vista previa de la portada</h2><p class="sub" style="margin:0">Así rota el banner en Inicio. El corte diagonal es parte del diseño.</p></div><button type="button" class="btn pri" id="newb">' + ic('upload') + 'Subir banner</button></div>' +
      '<div class="stage" id="stage" style="margin-top:14px">' + (slides || '<div style="padding:40px;text-align:center">No hay banners activos</div>') + '<div class="dots">' + dots + '</div></div>' +
      '<div class="sample" style="margin-top:8px">Escritorio 1600×500 px · Celular 800×800 px (opcional) · JPG, PNG o WebP hasta 2 MB. La diagonal y el texto se aplican solos.</div></section>' +
      '<section class="card"><h2>Orden de los banners</h2><p class="sub">Arrastra con el icono de puntos, o usa las flechas. El primero se ve primero en la web.</p><ul class="blist" id="blist">' + list + '</ul></section>' +
      '<section class="card"><h2>Imágenes de categorías</h2><p class="sub">La imagen que aparece en la sección Categorías de Inicio.</p><div class="catimgs">' + imgs + '</div></section>'
    );
    clearInterval(timer);
    if (active.length > 1) timer = setInterval(function () { if (current !== 'banners') return clearInterval(timer); cur = (cur + 1) % active.length; var sl = $$('#stage .slide'), dd = $$('#stage .dots i'); sl.forEach(function (s, i) { s.classList.toggle('on', i === cur); }); dd.forEach(function (s, i) { s.classList.toggle('on', i === cur); }); }, 2600);
    $('#newb').onclick = function () { toast('Aquí se elige la imagen y se sube a Cloudinary'); };
    $$('[data-img]').forEach(function (b) { b.onclick = function () { toast('Aquí se sube la nueva imagen de la categoría'); }; });
    $$('#blist [data-b]').forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-i'), a = b.getAttribute('data-b');
        if (a === 'up' && i > 0) { BANNERS.splice(i - 1, 0, BANNERS.splice(i, 1)[0]); }
        if (a === 'down' && i < BANNERS.length - 1) { BANNERS.splice(i + 1, 0, BANNERS.splice(i, 1)[0]); }
        if (a === 'on') BANNERS[i].on = !BANNERS[i].on;
        if (a === 'del') { BANNERS.splice(i, 1); toast('Banner quitado'); }
        if (a === 'edit') { toast('Aquí abre el formulario del banner'); return; }
        cur = 0; banners();
      };
    });
    $$('.bitem').forEach(function (li) {
      li.addEventListener('dragstart', function (e) { dragIdx = +li.getAttribute('data-i'); li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragIdx)); } catch (x) {} });
      li.addEventListener('dragend', function () { li.classList.remove('drag'); });
      li.addEventListener('dragover', function (e) { e.preventDefault(); $$('.bitem').forEach(function (x) { x.classList.remove('target'); }); li.classList.add('target'); });
      li.addEventListener('drop', function (e) { e.preventDefault(); var to = +li.getAttribute('data-i'); if (dragIdx !== null && dragIdx !== to) { BANNERS.splice(to, 0, BANNERS.splice(dragIdx, 1)[0]); cur = 0; toast('Orden actualizado'); banners(); } });
    });
  }

  /* ---------- 4 · Categorías ---------- */
  var editCat = null;
  function categorias() {
    var rows = CATS.map(function (c) {
      var n = PRODUCTS.filter(function (p) { return p.cat === c.n; }).length;
      if (editCat === c.id) {
        return '<tr><td><div class="thumb" style="background:linear-gradient(135deg,' + c.c1 + ',' + c.c2 + ')"></div></td><td><input class="in" id="en" value="' + esc(c.n) + '" aria-label="Nombre"></td><td><input class="in" id="es" value="' + esc(c.slug) + '" aria-label="Enlace" style="font-family:var(--mono)"></td><td class="num">' + n + '</td><td></td><td style="text-align:right;white-space:nowrap"><button type="button" class="btn sm pri" data-c="save" data-id="' + c.id + '">Guardar</button> <button type="button" class="btn sm" data-c="cancel">Cancelar</button></td></tr>';
      }
      return '<tr><td><div class="thumb" style="background:linear-gradient(135deg,' + c.c1 + ',' + c.c2 + ')"></div></td><td><b>' + esc(c.n) + '</b></td><td><span class="size">/productos?categoria=' + esc(c.slug) + '</span></td><td class="num">' + n + '</td><td>' + (c.vis ? '<span class="pill ok">Visible</span>' : '<span class="pill mute">Oculta</span>') + '</td>' +
        '<td style="text-align:right;white-space:nowrap"><button type="button" class="ibtn" data-c="edit" data-id="' + c.id + '" aria-label="Editar ' + esc(c.n) + '">' + ic('edit') + '</button> <button type="button" class="ibtn" data-c="vis" data-id="' + c.id + '" aria-label="Mostrar u ocultar">' + ic(c.vis ? 'eyeoff' : 'eye') + '</button> <button type="button" class="ibtn" data-c="del" data-id="' + c.id + '" aria-label="Quitar ' + esc(c.n) + '">' + ic('trash') + '</button></td></tr>';
    }).join('');
    page(
      '<section class="card"><h2>Nueva categoría</h2><p class="sub">El enlace se crea solo desde el nombre. La imagen se sube en Banners e imágenes.</p><form class="row" id="cf" style="align-items:flex-end"><div class="field" style="flex:1;min-width:220px"><label for="cn">Nombre</label><input class="in" id="cn" placeholder="Ej: Impresoras" required></div><button class="btn pri" type="submit">' + ic('plus') + 'Agregar categoría</button></form></section>' +
      '<section class="card"><div class="tablewrap"><table><thead><tr><th style="width:64px">Imagen</th><th>Nombre</th><th>Enlace</th><th>Productos</th><th>Estado</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div><div class="sample" style="margin-top:10px">Al quitar una categoría, sus productos pasan a «Sin categoría». No se borran.</div></section>'
    );
    $('#cf').onsubmit = function (e) {
      e.preventDefault(); var v = $('#cn').value.trim(); if (!v) return;
      var slug = v.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      CATS.push({ id: Date.now(), n: v, slug: slug, c1: '#17348f', c2: '#0e2160', vis: true }); toast('Categoría «' + v + '» agregada'); categorias();
    };
    $$('[data-c]').forEach(function (b) {
      b.onclick = function () {
        var a = b.getAttribute('data-c'), id = +b.getAttribute('data-id'), c = CATS.filter(function (x) { return x.id === id; })[0];
        if (a === 'edit') editCat = id;
        if (a === 'cancel') editCat = null;
        if (a === 'save') { c.n = $('#en').value.trim() || c.n; c.slug = $('#es').value.trim() || c.slug; editCat = null; toast('Categoría actualizada'); }
        if (a === 'vis') { c.vis = !c.vis; toast(c.vis ? 'Categoría visible' : 'Categoría oculta'); }
        if (a === 'del') { CATS.splice(CATS.indexOf(c), 1); toast('Categoría quitada'); }
        categorias();
      };
    });
  }

  /* ---------- 5 · Configuración ---------- */
  var CFG = { nombre: 'Ventas Virtual Colombia', lema: 'Distribuidores de computadores corporativos nuevos y usados', ciudad: 'Cali, Colombia', dir: 'Av. Estación #23dn-68 local 2-107, San Vicente, Cali (CC Pasarela, segundo piso)', wa: '573175591252', waShow: '317 559 1252', msg: 'Hola, estoy interesado en: {producto}', ig: 'https://www.instagram.com/ventasvirtualcol/', fb: 'https://www.facebook.com/p/Ventas-Virtual-Colombia-100092489010584/', tt: 'https://www.tiktok.com/@ventasvirtualcol', hor: 'Lunes a sábado, 9:00 a.m. a 6:00 p.m.', agotados: true, precios: true };
  function fld(id, label, key, hint, type) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><input class="in" id="' + id + '" data-k="' + key + '" value="' + esc(CFG[key]) + '"' + (type ? ' type="' + type + '"' : '') + '>' + (hint ? '<small>' + hint + '</small>' : '') + '</div>';
  }
  function config() {
    page(
      '<div class="cfg"><nav class="cfgnav" aria-label="Secciones"><a href="#c-emp" data-s="c-emp">Empresa</a><a href="#c-con" data-s="c-con">Contacto y WhatsApp</a><a href="#c-red" data-s="c-red">Redes sociales</a><a href="#c-hor" data-s="c-hor">Horario</a><a href="#c-cat" data-s="c-cat">Catálogo</a></nav>' +
      '<div class="cfgstack">' +
      '<section class="card" id="c-emp"><h2>Empresa</h2><p class="sub">Aparece en el encabezado, el pie de página y las políticas.</p><div class="grid2">' + fld('k1', 'Nombre comercial', 'nombre') + fld('k2', 'Ciudad', 'ciudad') + '</div><div class="field" style="margin-top:16px"><label for="k3">Lema</label><textarea class="in" id="k3" data-k="lema" rows="2">' + esc(CFG.lema) + '</textarea></div>' +
      '<div class="row" style="margin-top:16px;align-items:center"><div class="logo" style="width:56px;height:56px;border:1px solid var(--border);background:#fff">VV</div><div><b>Logo</b><div class="sample">PNG o SVG con fondo transparente</div></div><button type="button" class="btn sm" data-toast="Aquí se sube el logo">' + ic('upload') + 'Cambiar logo</button></div></section>' +
      '<section class="card" id="c-con"><h2>Contacto y WhatsApp</h2><p class="sub">El botón «Estoy interesado» abre WhatsApp con este número y mensaje.</p><div class="field"><label for="k4">Dirección del local</label><textarea class="in" id="k4" data-k="dir" rows="2">' + esc(CFG.dir) + '</textarea></div><div class="grid2" style="margin-top:16px">' + fld('k5', 'WhatsApp (con indicativo)', 'wa', 'Solo números. Ej: 573175591252') + fld('k6', 'Cómo se muestra el número', 'waShow') + '</div>' +
      '<div class="field" style="margin-top:16px"><label for="k7">Mensaje prellenado</label><input class="in" id="k7" data-k="msg" value="' + esc(CFG.msg) + '"><small>Usa {producto} para insertar el nombre del equipo.</small></div>' +
      '<div class="alerts" style="margin-top:14px"><li style="align-items:flex-start"><span class="ic ok">' + ic('chat') + '</span><div><b>Vista previa del mensaje</b><div id="wapv" class="sample" style="color:var(--text);font-size:13px"></div></div></li></div></section>' +
      '<section class="card" id="c-red"><h2>Redes sociales</h2><p class="sub">Déjalo vacío para ocultar el icono.</p><div class="grid2">' + fld('k8', 'Instagram', 'ig') + fld('k9', 'Facebook', 'fb') + fld('k10', 'TikTok', 'tt') + '</div></section>' +
      '<section class="card" id="c-hor"><h2>Horario de atención</h2><p class="sub">Se muestra en el pie de página. Vacío = no se muestra.</p>' + fld('k11', 'Horario', 'hor') + '</section>' +
      '<section class="card" id="c-cat"><h2>Catálogo</h2><p class="sub">Reglas de cómo se ve el inventario.</p>' +
      sw('agotados', 'Mostrar productos agotados', 'Se ven con la etiqueta Agotado y sin botón de WhatsApp.') + sw('precios', 'Mostrar precios', 'Si lo apagas, el cliente debe consultar el precio por WhatsApp.') + '</section>' +
      '<div class="savebar"><span class="sample" id="dirty">Sin cambios por guardar</span><div class="row"><button type="button" class="btn" id="undo">Descartar</button><button type="button" class="btn pri" id="save">' + ic('check') + 'Guardar cambios</button></div></div>' +
      '</div></div>'
    );
    var dirty = $('#dirty');
    function pv() { var n = CFG.wa || ''; $('#wapv').textContent = 'wa.me/' + n + ' → «' + (CFG.msg || '').replace('{producto}', 'Lenovo ThinkPad T14 Gen 2') + '»'; }
    pv();
    $$('[data-k]').forEach(function (el) { el.oninput = function () { CFG[el.getAttribute('data-k')] = el.value; dirty.textContent = 'Hay cambios sin guardar'; pv(); }; });
    $$('.tg[data-sw]').forEach(function (t) { t.onclick = function () { var k = t.getAttribute('data-sw'); CFG[k] = !CFG[k]; t.setAttribute('aria-checked', String(CFG[k])); dirty.textContent = 'Hay cambios sin guardar'; }; });
    $$('[data-toast]').forEach(function (b) { b.onclick = function () { toast(b.getAttribute('data-toast')); }; });
    $$('.cfgnav a').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); var t = document.getElementById(a.getAttribute('data-s')); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
    $('#save').onclick = function () { dirty.textContent = 'Guardado hace un momento'; toast('Configuración guardada en Supabase (ejemplo)'); };
    $('#undo').onclick = function () { config(); toast('Cambios descartados'); };
  }
  function sw(k, t, d) { return '<div class="switch"><div><b>' + t + '</b><small>' + d + '</small></div><button type="button" class="tg" role="switch" data-sw="' + k + '" aria-checked="' + CFG[k] + '" aria-label="' + t + '"></button></div>'; }

  var VIEWS = { bandeja: bandeja, productos: productos, banners: banners, categorias: categorias, config: config };
  var h = (location.hash || '').replace('#', '');
  go(VIEWS[h] ? h : 'bandeja');
})();
</script>
